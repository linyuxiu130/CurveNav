data:
  root: data/policy_dataset
  observation_frames: 4
  frame_spacing_m: 0.45
  expert_waypoint_spacing_m: 0.15
  future_steps: 24
  image_height: 126
  image_width: 224
  max_depth_m: 5.0
  canonical_focal_x_px: 166.80851063829786
  canonical_focal_y_px: 166.80851063829786
  camera_forward_offset_m: 0.28618
  camera_height_m: 0.62532
  camera_downward_pitch_degrees: 10.0

model:
  trajectory:
    num_control_points: 8
    degree: 3
    num_path_points: 64
    normalization_scale_m: 4.0
  depth_encoder:
    model_dim: 256
    frame_tokens_height: 8
    frame_tokens_width: 12
    dropout: 0.0
  point_goal_encoder:
    model_dim: 256
    hidden_dim: 256
    goal_clip_distance_m: 25.0
  condition_encoder:
    model_dim: 256
    transformer_layers: 2
    transformer_heads: 4
    dropout: 0.0
  trajectory_flow:
    model_dim: 256
    transformer_layers: 3
    transformer_heads: 4
    inference_candidates: 16
    integration_steps: 8
    inference_seed: 20260821
    dropout: 0.0
  trajectory_evaluator:
    minimum_obstacle_height_m: 0.05
    robot_height_m: 0.70
    robot_radius_m: 0.25
    safety_margin_m: 0.10
    discount_factor: 0.95
    clearance_weight: 10.0
    length_weight: 1.0
    goal_weight: 1.0
training:
  seed: 42
  per_device_batch_size: 256
  samples_per_epoch: 38400
  epochs: 200
  num_workers: 8
  prefetch_factor: 2
  warmup_epochs: 5
  min_learning_rate_factor: 0.01
  overfit_steps: 1500
  overfit_batch_size: 8
  overfit_max_loss_ratio: 0.1
  overfit_oracle_ade_m: 0.12
  overfit_selected_ade_m: 0.20
  log_every_steps: 20
  checkpoint_every_epochs: 20
  output_dir: outputs/train_policy
  checkpoint_path: outputs/train_policy/overfit.pt
  learning_rate: 0.0004
  weight_decay: 0.01
  grad_clip_norm: 1.0
  ema_decay: 0.9999
