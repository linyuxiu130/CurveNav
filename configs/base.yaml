data:
  root: data/policy_dataset
  observation_frames: 4
  frame_spacing_m: 0.45
  expert_waypoint_spacing_m: 0.15
  future_steps: 24
  image_height: 126
  image_width: 224
  max_depth_m: 5.0
  canonical_focal_x_px: 166.80851063829786
  canonical_focal_y_px: 166.80851063829786
  camera_forward_offset_m: 0.28618
  camera_height_m: 0.62532
  camera_downward_pitch_degrees: 10.0

model:
  trajectory:
    num_target_control_points: 8
    target_spline_degree: 3
    num_curvature_control_points: 7
    curvature_spline_degree: 3
    num_path_points: 64
    maximum_curvature_inv_m: 8.0
  depth_encoder:
    model_dim: 384
    frame_tokens_height: 8
    frame_tokens_width: 12
    dropout: 0.0
  point_goal_encoder:
    model_dim: 384
    hidden_dim: 384
    goal_clip_distance_m: 25.0
  condition_encoder:
    model_dim: 384
    transformer_layers: 4
    transformer_heads: 8
    dropout: 0.0
  trajectory_flow:
    model_dim: 384
    proposal_layers: 2
    transformer_layers: 8
    transformer_heads: 8
    integration_steps: 8
    dropout: 0.0
training:
  seed: 42
  global_batch_size: 1024
  per_device_batch_size: 171
  samples_per_epoch: 40960
  epochs: 200
  num_workers: 2
  prefetch_factor: 2
  warmup_epochs: 5
  min_learning_rate_factor: 0.01
  log_every_steps: 20
  checkpoint_every_epochs: 20
  output_dir: outputs/train_policy
  learning_rate: 0.0004
  weight_decay: 0.01
  grad_clip_norm: 1.0
  ema_decay: 0.9999
