data:
  root: data/policy_dataset
  observation_frames: 4
  frame_spacing_m: 0.45
  expert_waypoint_spacing_m: 0.15
  future_steps: 24
  image_height: 126
  image_width: 224
  max_depth_m: 5.0
  canonical_focal_x_px: 166.80851063829786
  canonical_focal_y_px: 166.80851063829786
  camera_forward_offset_m: 0.28618
  camera_height_m: 0.62532
  camera_downward_pitch_degrees: 10.0

model:
  trajectory:
    num_heading_control_points: 8
    spline_degree: 3
    num_path_points: 64
    log_length_mean: 0.9411997728025253
    log_length_std: 0.6578984994694861
    heading_increment_mean_rad: [0.0027091927181629527, 0.005207439937511474, 0.006545409534199333, 0.005466179133750451, 0.0027312263638442787, 0.0029715759159046357, -0.0006079559277851468]
    heading_increment_std_rad: [0.1039597669108465, 0.2211581749264293, 0.2887267459379414, 0.2893491499417256, 0.30020639618179806, 0.26251125436301076, 0.14751645522709783]
  depth_encoder:
    model_dim: 384
    frame_tokens_height: 8
    frame_tokens_width: 12
    dropout: 0.0
  point_goal_encoder:
    model_dim: 384
    hidden_dim: 384
  condition_encoder:
    model_dim: 384
    transformer_layers: 4
    transformer_heads: 8
    dropout: 0.0
  trajectory_decoder:
    model_dim: 384
    transformer_layers: 12
    transformer_heads: 8
    path_tokens: 16
    dropout: 0.0
training:
  seed: 42
  global_batch_size: 1024
  per_device_batch_size: 256
  samples_per_epoch: 40960
  epochs: 200
  num_workers: 2
  prefetch_factor: 2
  warmup_epochs: 5
  min_learning_rate_factor: 0.01
  log_every_steps: 20
  checkpoint_every_epochs: 20
  output_dir: outputs/train_policy
  learning_rate: 0.0002
  weight_decay: 0.01
  grad_clip_norm: 1.0
  ema_decay: 0.9999
