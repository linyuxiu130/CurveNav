[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curvenav-navigation"
version = "1.0.0"
description = "CurveNav: PointGoal-conditioned smooth metric local navigation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6,<2.8",
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6.0",
]

[project.scripts]
curvenav-init = "curvenav.deployment.bspline_bundle:main"
curvenav-train = "curvenav.training.bspline_replay:main"
curvenav-prepare-data = "curvenav.data.prepare_fixed40:main"
curvenav-evaluate = "curvenav.evaluation.run_bspline40:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
