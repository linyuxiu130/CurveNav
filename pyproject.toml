[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curvenav-navigation"
version = "1.0.0"
description = "CurveNav: PointGoal-conditioned Transformer B-spline local navigation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "scipy>=1.10",
  "opencv-python>=4.8",
  "PyYAML>=6.0",
  "accelerate>=1.14",
]

[project.scripts]
curvenav-diagnose = "curvenav.training.diagnostic:main"
curvenav-train = "curvenav.training.train:main"
curvenav-prepare-data = "curvenav.data.prepare:main"
curvenav-evaluate = "curvenav.evaluation.offline:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
